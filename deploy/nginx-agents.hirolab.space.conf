# /etc/nginx/sites-available/agents.hirolab.space  (then link it into sites-enabled)
# Same pattern as immich-photo / wazuh: HTTPS on this machine's Tailscale address only.
server {
    listen 100.81.244.14:443 ssl http2;
    server_name agents.hirolab.space;

    ssl_certificate     /etc/letsencrypt/live/agents.hirolab.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agents.hirolab.space/privkey.pem;

    # Uploads of images and 3D models (the console allows 64 MB per file).
    client_max_body_size 72m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The relay accepts only tailnet clients and reads the real address from here.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The laptop long-polls (25 s) and large files stream through.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}

# Typing the bare name opens http://; send it to HTTPS.
server {
    listen 100.81.244.14:80;
    server_name agents.hirolab.space;
    return 301 https://$host$request_uri;
}
