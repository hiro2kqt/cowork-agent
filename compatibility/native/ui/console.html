<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bridge Console</title>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--line:#e6e5e1;--text:#1d1d1b;--muted:#8a8984;--soft:#f0efec;--codex:#4355c4;--claude:#c4623d;--ok:#1f8a4c;--warn:#b26a00;--warn-bg:#fff6e0;--bad:#c0362c;--bad-bg:#fdeeec;--r:10px;font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--panel:#1c1c1b;--line:#2e2e2c;--text:#ecebe8;--muted:#8f8d87;--soft:#252523;--codex:#98a4f2;--claude:#ef9f7f;--ok:#62cc8f;--warn:#efb04f;--warn-bg:#33291a;--bad:#f0857c;--bad-bg:#3a1f1d}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);height:100vh;height:100dvh;display:flex;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:7px;padding:4px 10px;cursor:pointer}
button:hover{border-color:var(--muted)}button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--text);color:var(--panel);border-color:var(--text)}
button.ghost{border-color:transparent;color:var(--muted);padding:2px 6px}button.ghost:hover{color:var(--text)}
input,textarea,select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 9px;width:100%}
input:focus,textarea:focus{outline:none;border-color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:12px}.codex{color:var(--codex)}.claude{color:var(--claude)}
.row{display:flex;align-items:center;gap:8px}.grow{flex:1}.wrap{flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block;flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;padding:3px 12px;border-radius:6px}.seg button.on{background:var(--soft);font-weight:600}
.badge{font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.bad{background:var(--bad-bg);color:var(--bad)}.badge.ok{color:var(--ok)}
/* sidebar */
aside{width:270px;flex:none;border-right:1px solid var(--line);background:var(--panel);padding:18px 14px;display:flex;flex-direction:column;gap:22px;overflow:auto}
aside>*{flex-shrink:0}
.brand{font-weight:700;font-size:15px}
.label{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.session{display:flex;flex-direction:column;gap:2px;padding:9px 10px;border-radius:var(--r);border:1px solid var(--line);cursor:pointer;text-align:left;width:100%}
.session+.session{margin-top:8px}
.session:hover{border-color:var(--muted)}
.session .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.session.missing{border-color:var(--bad)}
.star{font-size:11px;font-weight:700}
.roles label{display:block;margin-top:6px}
/* feed */
.feed{flex:1;display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:6px;padding:12px 20px;border-bottom:1px solid var(--line)}
.tab{border:0;color:var(--muted)}.tab.on{color:var(--text);font-weight:600}
#timeline{flex:1;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.divider{text-align:center;font-size:11.5px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.card.attn{border-color:var(--warn)}.card.problem{border-color:var(--bad)}
.head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px}
.msg{white-space:pre-wrap;overflow-wrap:anywhere}
.ask{background:var(--warn-bg);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.interp{font-size:12.5px;color:var(--muted);border-left:2px solid var(--line);padding-left:8px}
.deliv{display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.deliv .r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who{font-weight:600;min-width:52px}
.steps{display:flex;gap:10px;color:var(--muted)}.steps .on{color:var(--ok)}.steps .bad{color:var(--bad)}.steps .warn{color:var(--warn)}
.err{color:var(--bad);font-size:12px}
details summary{cursor:pointer;color:var(--muted);font-size:12px;list-style:none}details summary::-webkit-details-marker{display:none}
details pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--soft);border-radius:6px;padding:8px;max-height:260px;overflow:auto;font-size:12px;margin:6px 0 0}
.thread{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:8px}
.ev{display:flex;gap:8px;align-items:baseline;font-size:13.5px}
.ev .from{font-weight:600;flex:none}.ev .msg{flex:1}
.ev.peer{background:var(--soft);border-radius:8px;padding:5px 8px}
.ev .reply{visibility:hidden}.ev:hover .reply{visibility:visible}
.empty{margin:auto;text-align:center;color:var(--muted);line-height:1.9}
/* composer */
footer{border-top:1px solid var(--line);padding:12px 20px;display:flex;flex-direction:column;gap:8px;background:var(--panel)}
#composer{resize:none;min-height:44px;max-height:220px}
.to{font-size:12.5px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:20}
.box{background:var(--panel);border-radius:12px;width:min(620px,94vw);max-height:82vh;display:flex;flex-direction:column;gap:10px;padding:16px}
.list{overflow:auto;display:flex;flex-direction:column;gap:4px}
.item{text-align:left;border:1px solid transparent;border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:1px}
.item:hover{background:var(--soft)}.item.sel{border-color:var(--text)}
.atts{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.att{border:1px solid var(--line);border-radius:8px;padding:0;overflow:hidden;background:var(--soft);display:flex;flex-direction:column;width:148px;text-align:left}
.att:hover{border-color:var(--muted)}
.att .thumb{height:104px;display:flex;align-items:center;justify-content:center;background:var(--soft);font-size:30px;color:var(--muted)}
.att img{max-width:100%;max-height:104px;display:block}
.att .cap{padding:4px 7px;font-size:11.5px;background:var(--panel);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 4px 1px 9px;background:var(--soft)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.gallery .att{width:auto}.gallery .att .thumb{height:130px}.gallery .att img{max-height:130px}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:30;display:flex;flex-direction:column}
.viewer .bar{display:flex;align-items:center;gap:8px;padding:10px 14px;color:#eee;font-size:13px}
.viewer .bar button{color:#eee;border-color:#555}.viewer .bar button:hover{border-color:#aaa}
.viewer .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:auto;position:relative}
.viewer .stage img{max-width:96%;max-height:96%;cursor:zoom-in;background:repeating-conic-gradient(#ccc 0 25%,#fff 0 50%) 0 0/16px 16px}
.viewer .stage img.actual{max-width:none;max-height:none;cursor:zoom-out}
.viewer .model{width:min(1200px,96vw);height:100%;border-radius:10px;overflow:hidden}
.viewer .hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:12px;color:#bbb;pointer-events:none}
.dropping footer{outline:2px dashed var(--codex);outline-offset:-6px}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--bad);color:#fff;padding:8px 14px;border-radius:8px;z-index:40;max-width:80vw}
@media (min-width:821px){.menu{display:none}}
@media (max-width:820px){
  aside{position:fixed;top:0;bottom:0;left:0;width:min(300px,86vw);z-index:11;transform:translateX(-102%);transition:transform .18s;box-shadow:0 0 24px rgba(0,0,0,.3);
    padding-top:max(18px,env(safe-area-inset-top));padding-bottom:max(18px,env(safe-area-inset-bottom));padding-left:max(14px,env(safe-area-inset-left))}
  body.side-open aside{transform:none}
  /* Over the page while the sidebar is open: taps outside close it instead of reaching the chat. */
  #scrim{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.35);display:none}
  body.side-open #scrim{display:block}
  /* Tabs scroll sideways without a scrollbar; Clear moves into the sidebar. */
  .top{padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top));gap:2px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
  .top::-webkit-scrollbar{display:none}
  .top .tab{padding:6px 9px}.top .clear{display:none}
  .menu{font-size:18px;padding:4px 10px}
  #timeline{padding:10px 8px;gap:10px}
  .card{padding:10px 11px;border-radius:12px}
  /* Name above the message, so the text gets the full width. */
  .ev{display:block}.ev>span:first-child{display:block;margin-bottom:1px;font-size:12.5px}.ev .msg{display:block}
  /* Reply shows where an answer is expected; any agent message can be answered by tapping it. */
  .ev .reply{display:none}.ev .reply.ask-reply{display:inline-block;visibility:visible;padding:2px 0;margin-top:2px;color:var(--warn)}
  .ev .atts{margin-top:6px}
  .att{width:calc(50% - 4px);max-width:180px}
  footer{padding:8px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom))}
  footer .row{flex-wrap:wrap}
  .to{font-size:12px}
  /* iOS zooms into inputs smaller than 16px. */
  input,textarea,select{font-size:16px}
  #sendBtn{padding:7px 16px}
  #attachBtn{font-size:18px;padding:4px 8px}
  .box{width:100vw;max-height:88dvh;border-radius:14px 14px 0 0;align-self:flex-end;padding-bottom:max(16px,env(safe-area-inset-bottom))}
  .item{padding:10px}
  /* Viewer: solid, two short rows. */
  .viewer{background:#111}
  .viewer .bar{flex-wrap:wrap;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));row-gap:6px}
  .viewer .bar .grow{order:-1;flex-basis:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .viewer .bar .close{position:absolute;right:8px;top:max(6px,env(safe-area-inset-top));font-size:20px}
  .viewer .bar .grow{padding-right:40px}
  .viewer .model{width:100vw;border-radius:0}
  .viewer .stage img{max-width:100%;max-height:100%}
  .viewer .hint{bottom:max(10px,env(safe-area-inset-bottom));width:92vw;text-align:center}
}
}
</style>
</head>
<body>
<aside id="side"></aside>
<div id="scrim"></div>
<section class="feed">
  <div class="top" id="tabs"></div>
  <div id="timeline"></div>
  <footer>
    <div id="replyBar" class="row small muted" hidden></div>
    <div id="pendingFiles" class="chips" hidden></div>
    <textarea id="composer" rows="2" placeholder="Message…  @codex  @claude  @all"></textarea>
    <div class="row">
      <button class="ghost" id="attachBtn" title="Attach images, 3D models, or files (you can also paste or drop them)">📎</button>
      <input type="file" id="fileInput" multiple hidden>
      <div id="to" class="to row wrap grow"></div>
      <label class="row small muted" id="fyiBox" title="Send a read-only copy to the agent that is not assigned"><input type="checkbox" id="notifyOther" checked style="width:auto"> FYI copy</label>
      <button class="primary" id="sendBtn">Send</button>
    </div>
  </footer>
</section>
<div id="modalRoot"></div>
<div id="viewerRoot"></div>
<script src="/console-viewer.js"></script>
<script>
'use strict';
const token = new URLSearchParams(location.hash.slice(1)).get('t') || localStorage.getItem('bridgeConsoleToken') || '';
// Through the cloud relay there is no token: the relay checks your login and the laptop adds the token itself.
if (token) { localStorage.setItem('bridgeConsoleToken', token); history.replaceState(null, '', location.pathname); }
const AGENTS = ['codex', 'claude'];
const NAME = { codex: 'Codex', claude: 'Claude', user: 'You', system: '' };
const PHASE = { routing: ['Triaging', ''], awaiting_user: ['Choose who', 'warn'], dispatching: ['Sending', ''], delivered: ['Sent', ''],
  in_progress: ['Working', ''], done: ['Done', 'ok'], delivery_problem: ['Not delivered', 'bad'], cancelled: ['Cancelled', ''] };
const ROLE = { route: 'triage', assign: '', observe: 'FYI', reply: 'reply', chat: '' };
let S = null, lastVersion = -1, lastAvail = '', tab = 'all', replyTo = null, drafts = {}, pending = false, uploading = 0;
let attached = JSON.parse(sessionStorage.getItem('bridgeConsoleFiles') || '[]');
// One mode: @mentions assign directly; otherwise the router decides whether it is a question or work, and who does it.
const kind = 'task';
const $ = id => document.getElementById(id);
// Optional parts are written as `cond ? node : null`; never let a null become the text "null".
const nativeReplace = Element.prototype.replaceChildren;
Element.prototype.replaceChildren = function (...kids) { return nativeReplace.apply(this, kids.filter(k => k !== null && k !== undefined && k !== false)); };
const uuid = () => crypto.randomUUID?.() ?? [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, '0')).join('');
function el(tag, attrs = {}, ...kids) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === undefined || v === null || v === false) continue;
    if (k === 'class') node.className = v; else if (k.startsWith('on')) node.addEventListener(k.slice(2), v); else node.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid !== null && kid !== undefined && kid !== false && kid !== '') node.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return node;
}
const time = ms => ms ? new Date(ms).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }) : '';
const full = ms => ms ? new Date(ms).toLocaleString() : '';
const who = a => el('span', { class: `from ${a}` }, NAME[a] ?? a);
function toast(m) { const t = el('div', { class: 'toast', role: 'alert' }, m); document.body.append(t); setTimeout(() => t.remove(), 6000); }

async function api(path, body) {
  const res = await fetch(path, { method: body === undefined ? 'GET' : 'POST',
    headers: { 'x-console-token': token, ...(body === undefined ? {} : { 'content-type': 'application/json' }) },
    body: body === undefined ? undefined : JSON.stringify(body) });
  const data = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}
async function act(path, body) { try { const r = await api(path, body); await poll(true); return r; } catch (e) { toast(e.message); throw e; } }

/* ---------- files ---------- */
const ICON = { image: '🖼', model: '🧊', other: '📄' };
const bytes = n => n >= 1048576 ? `${(n / 1048576).toFixed(1)} MB` : `${Math.max(1, Math.round(n / 1024))} KB`;
const blobs = new Map();
function fileBlob(id) {
  if (!blobs.has(id)) blobs.set(id, fetch(`/api/files/${id}`, { headers: { 'x-console-token': token } })
    .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.blob(); })
    .catch(e => { blobs.delete(id); throw e; }));
  return blobs.get(id);
}
const urls = new Map();
async function fileUrl(id, mime) {
  if (!urls.has(id)) urls.set(id, URL.createObjectURL(new Blob([await fileBlob(id)], { type: mime })));
  return urls.get(id);
}
const metaOf = id => S?.files?.[id] || attached.find(f => f.id === id) || null;
/** Hide the "[file …] name: path" lines agents add for each other; the files are shown as tiles. */
const stripFiles = text => String(text || '').replace(/\n*Attached files \(local copies[^\n]*\):?(\n- \[file [a-f0-9]{16}\][^\n]*)+/g, '').replace(/^- \[file [a-f0-9]{16}\][^\n]*\n?/gm, '').trim();
// 3D thumbnails are rendered one at a time and kept for the page's lifetime; very large models keep the icon.
const thumbs = new Map();
let thumbQueue = Promise.resolve();
function modelThumb(meta) {
  if (meta.size > 40 * 1048576 || !window.BridgeViewer) return Promise.resolve(null);
  if (!thumbs.has(meta.id)) thumbs.set(meta.id, thumbQueue = thumbQueue.catch(() => {}).then(async () => {
    const model = await window.BridgeViewer.parseModel(meta.name, await (await fileBlob(meta.id)).arrayBuffer());
    return window.BridgeViewer.snapshot(model, { upAxis: window.BridgeViewer.defaultUp(meta.name), dark: matchMedia('(prefers-color-scheme: dark)').matches });
  }).catch(() => null));
  return thumbs.get(meta.id);
}
function tile(meta, list, index) {
  const thumb = el('div', { class: 'thumb' }, ICON[meta.kind] || ICON.other);
  if (meta.kind === 'image') fileUrl(meta.id, meta.mime).then(u => thumb.replaceChildren(el('img', { src: u, alt: meta.name }))).catch(() => {});
  else if (meta.kind === 'model') modelThumb(meta).then(u => { if (u) thumb.replaceChildren(el('img', { src: u, alt: meta.name })); }).catch(() => {});
  return el('button', { class: 'att', title: `${meta.name} · ${bytes(meta.size)}${meta.by ? ` · from ${NAME[meta.by] || meta.by}` : ''}`, onclick: () => openViewer(list, index) },
    thumb, el('span', { class: 'cap' }, meta.name));
}
/** `shown` (per card) keeps a file that several messages mention from appearing more than once. */
function attachmentsView(ids, shown) {
  const list = (ids || []).filter(id => !shown || (!shown.has(id) && shown.add(id))).map(metaOf).filter(Boolean);
  return list.length ? el('div', { class: 'atts' }, ...list.map((m, i) => tile(m, list, i))) : null;
}

/* ---------- viewer ---------- */
let viewerClose = null;
function openViewer(list, index) {
  viewerClose?.();
  let mounted = null;
  const root = $('viewerRoot');
  const stage = el('div', { class: 'stage' });
  const title = el('span', { class: 'grow' });
  const info = el('span', { class: 'small', style: 'color:#bbb' });
  const upBtn = el('button', { class: 'ghost small', hidden: true }, '');
  const save = el('button', { class: 'ghost small' }, 'Download');
  const prev = el('button', { class: 'ghost', title: 'Previous (←)' }, '‹'), next = el('button', { class: 'ghost', title: 'Next (→)' }, '›');
  const close = () => { mounted?.destroy(); mounted = null; root.replaceChildren(); viewerClose = null; document.removeEventListener('keydown', keys); };
  const keys = e => {
    if (e.key === 'Escape') { e.stopPropagation(); close(); }
    else if (e.key === 'ArrowLeft' && list.length > 1) show(index - 1);
    else if (e.key === 'ArrowRight' && list.length > 1) show(index + 1);
  };
  async function show(i) {
    index = (i + list.length) % list.length;
    const meta = list[index];
    mounted?.destroy(); mounted = null;
    title.replaceChildren(el('b', {}, meta.name), el('span', { style: 'color:#bbb' }, ` · ${bytes(meta.size)}${meta.by ? ` · ${NAME[meta.by] || meta.by}` : ''}${list.length > 1 ? ` · ${index + 1}/${list.length}` : ''}`));
    info.textContent = ''; upBtn.hidden = true;
    prev.hidden = next.hidden = list.length < 2;
    save.onclick = async () => { const a = el('a', { href: await fileUrl(meta.id, meta.mime), download: meta.name }); a.click(); };
    stage.replaceChildren(el('span', { style: 'color:#bbb' }, 'Loading…'));
    try {
      if (meta.kind === 'image') {
        const img = el('img', { src: await fileUrl(meta.id, meta.mime), alt: meta.name, title: 'Click to toggle actual size' });
        img.addEventListener('click', () => img.classList.toggle('actual'));
        if (list[index] === meta) stage.replaceChildren(img);
      } else if (meta.kind === 'model') {
        const buffer = await (await fileBlob(meta.id)).arrayBuffer();
        const model = await window.BridgeViewer.parseModel(meta.name, buffer);
        if (list[index] !== meta || !root.firstChild) return;
        const box = el('div', { class: 'model' });
        stage.replaceChildren(box, el('div', { class: 'hint' }, matchMedia('(pointer: coarse)').matches
          ? 'One finger: rotate · two fingers: zoom and move · double-tap: reset'
          : 'Drag to rotate · right-drag or Shift+drag to pan · scroll to zoom · double-click to reset'));
        let up = window.BridgeViewer.defaultUp(meta.name);
        mounted = window.BridgeViewer.mountModel(box, model, { upAxis: up, dark: matchMedia('(prefers-color-scheme: dark)').matches });
        const [x, y, z] = mounted.info.size.map(v => +v.toPrecision(4));
        info.textContent = `${mounted.info.triangles.toLocaleString()} triangles · ${x} × ${y} × ${z}`;
        upBtn.hidden = false; upBtn.textContent = `Up: ${up.toUpperCase()}`;
        upBtn.onclick = () => { up = up === 'z' ? 'y' : 'z'; upBtn.textContent = `Up: ${up.toUpperCase()}`; mounted?.setUp(up); };
      } else stage.replaceChildren(el('div', { style: 'color:#ddd;text-align:center;line-height:2' }, el('div', { style: 'font-size:40px' }, ICON.other), 'No preview for this file type.', el('br'), el('button', { class: 'ghost', style: 'color:#eee', onclick: () => save.click() }, 'Download')));
    } catch (e) {
      stage.replaceChildren(el('div', { style: 'color:#f0857c' }, `Cannot show this file: ${e.message}`));
    }
  }
  prev.addEventListener('click', () => show(index - 1));
  next.addEventListener('click', () => show(index + 1));
  root.replaceChildren(el('div', { class: 'viewer', role: 'dialog', 'aria-label': 'File viewer', onclick: e => { if (e.target === stage) close(); } },

function deliveries(r) {
  const rows = r.deliveries.map(d => {
    const status = d.stale ? 'uncertain' : d.status;
    const steps = el('span', { class: 'steps' });
    const step = (on, text, tone) => steps.append(el('span', { class: tone || (on ? 'on' : '') }, on && !tone ? '✓ ' : '', text));
    if (status === 'failed') step(false, '✕ not delivered', 'bad');
    else if (status === 'uncertain') step(false, '? uncertain', 'warn');
    else if (status !== 'submitted') step(false, status === 'pending' ? 'queued' : 'sending…');
    else {
      step(true, 'sent');
      if (d.purpose === 'route') step(Boolean(r.routing?.decision), 'decided');
      else {
        step(Boolean(d.readAt), 'read');
        if (d.purpose === 'chat') step(Boolean(d.doneAt), 'answered');
        else if (d.purpose !== 'observe') d.blockedAt && !d.doneAt ? step(false, 'blocked', 'bad') : step(Boolean(d.doneAt), 'done');
      }
    }
    const retry = status === 'failed' ? el('button', { class: 'ghost', onclick: () => act('/api/retry', { requestId: r.id, deliveryId: d.id }) }, 'Resend')
      : status === 'uncertain' && !d.stale ? el('button', { class: 'ghost', onclick: () => {
        if (confirm(`It may already have reached ${NAME[d.to]}. Checked, and it did not arrive?`)) act('/api/retry', { requestId: r.id, deliveryId: d.id, confirmUncertain: true });
      } }, 'Resend…') : null;
    return el('div', {},
      el('div', { class: 'r' }, el('span', { class: `who ${d.to}` }, NAME[d.to]), ROLE[d.purpose] ? el('span', { class: 'badge' }, ROLE[d.purpose]) : null, steps, retry,
        d.body ? el('details', {}, el('summary', {}, 'sent text'), el('pre', {}, d.body,
          d.attempts.length > 1 ? `\n\n— ${d.attempts.length} attempts: ${d.attempts.map(a => `${time(a.at)} ${a.status}`).join(', ')}` : '')) : null),
      d.error && status !== 'submitted' ? el('div', { class: 'err' }, d.error) : null);
  });
  if (!rows.length) return null;
  // Delivery details only matter when something went wrong; otherwise they fold away.
  const trouble = r.deliveries.some(d => d.stale || ['failed', 'uncertain'].includes(d.status));
  return trouble ? el('div', { class: 'deliv' }, ...rows) : el('details', {}, el('summary', {}, 'details'), el('div', { class: 'deliv', style: 'margin-top:6px' }, ...rows));
}

/** One short word per recipient for the card header. */
function shortStatus(d) {
  const status = d.stale ? 'uncertain' : d.status;
  if (status === 'failed') return ['not delivered', 'color:var(--bad)'];
  if (status === 'uncertain') return ['uncertain', 'color:var(--warn)'];
  if (status !== 'submitted') return ['sending…', ''];
  if (d.blockedAt && !d.doneAt) return ['blocked', 'color:var(--bad)'];
  if (d.doneAt) return ['✓', 'color:var(--ok)'];
  return [d.readAt ? 'working' : 'sent', ''];
}

function renderGallery(box) {

function renderTimeline() {

/* ---------- composer ---------- */
function setReply(e) { replyTo = e; renderComposer(); $('composer').focus(); }
function mentions(text) {

  for (const m of text.matchAll(/(^|[^\w@])@(codex|claude|all)\b/gi)) { const n = m[2].toLowerCase(); if (n === 'all') AGENTS.forEach(a => found.add(a)); else found.add(n); }
  return AGENTS.filter(a => found.has(a));
}
function renderComposer() {
  const bar = $('replyBar');
  bar.hidden = !replyTo;
  if (replyTo) bar.replaceChildren(`↳ Replying to ${NAME[replyTo.from]}: ${replyTo.text.slice(0, 80)}${replyTo.text.length > 80 ? '…' : ''}`,
    el('button', { class: 'ghost', onclick: () => { replyTo = null; renderComposer(); } }, '×'));
  const text = $('composer').value;
  let named = mentions(text);
  const parts = [];
  let problem = '';
  const sel = a => S?.selection[a];
  if (replyTo && !named.length) { named = [replyTo.from]; parts.push('to ', el('b', { class: replyTo.from }, NAME[replyTo.from])); }
  else if (kind === 'chat') {
    const to = named.length ? named : AGENTS.filter(sel);
    to.forEach((a, i) => parts.push(i ? ', ' : 'to ', el('b', { class: a }, NAME[a])));
    if (!to.length) problem = 'choose a session';
    named = to;
  } else if (named.length) {
    named.forEach((a, i) => parts.push(i ? ' + ' : 'assign ', el('b', { class: a }, NAME[a])));
  } else if (S?.router) parts.push(el('span', {}, 'router ', el('b', { class: S.router }, NAME[S.router]), ' decides who does it'));
  else problem = 'choose a router, or @mention';
  for (const a of named) if (!sel(a)) problem = `no ${NAME[a]} session`;
  $('to').replaceChildren(problem ? el('span', { style: 'color:var(--bad)' }, problem) : el('span', { class: 'muted' }, ...parts));
  $('fyiBox').hidden = Boolean(replyTo);
  $('sendBtn').disabled = pending || uploading > 0 || (!text.trim() && !attached.length) || Boolean(problem);
  const chips = $('pendingFiles');
  chips.hidden = !attached.length && !uploading;
  chips.replaceChildren(...attached.map(f => el('span', { class: 'chip', title: bytes(f.size) }, `${ICON[f.kind] || ICON.other} ${f.name}`,
    el('button', { class: 'ghost', style: 'padding:0 4px', title: 'Remove', onclick: () => { attached = attached.filter(x => x !== f); saveAttached(); renderComposer(); } }, '×'))),
    ...(uploading ? [el('span', { class: 'small muted' }, `Uploading ${uploading}…`)] : []));
}

async function send() {
  const message = $('composer').value;
  if ((!message.trim() && !attached.length) || pending || $('sendBtn').disabled) return;
  pending = true; renderComposer();
  const clientId = sessionStorage.getItem('bridgeConsoleDraftId') || uuid();
  sessionStorage.setItem('bridgeConsoleDraftId', clientId);
  try {
    await act('/api/submit', { clientId, message, replyTo: replyTo?.id, notifyOther: $('notifyOther').checked, kind, attachments: attached.map(f => f.id) });
    $('composer').value = ''; replyTo = null; attached = []; saveAttached();
    sessionStorage.removeItem('bridgeConsoleDraftId'); sessionStorage.removeItem('bridgeConsoleDraft');
    $('timeline').scrollTop = $('timeline').scrollHeight;
  } catch {} finally { pending = false; autosize(); renderComposer(); }
}

      onclick: () => { chosen = i; ok.disabled = false; draw(); }, ondblclick: () => { chosen = i; ok.click(); } },
      el('div', { class: 'row' }, el('b', { class: 'grow' }, i.title || '(untitled)'), S.selection[agent]?.id === i.id ? el('span', { class: 'badge' }, 'current') : null,
        el('span', { class: `badge ${i.status === 'notLoaded' ? 'warn' : ''}` }, i.status === 'notLoaded' ? 'not open' : i.status || '?')),
      el('div', { class: 'small muted' }, [i.cwd, agent === 'codex' ? i.source : i.entrypoint].filter(Boolean).join(' · ')),
      el('div', { class: 'small muted' }, i.id))) : [el('div', { class: 'small muted' }, 'No sessions.')]));
  }
  async function load() {
    list.replaceChildren(el('div', { class: 'small muted' }, 'Loading…'));
    try { data = await api('/api/sessions'); notes.replaceChildren(...data.warnings.map(w => el('div', {}, w))); }
    catch (e) { data = {}; notes.replaceChildren(el('div', { class: 'err' }, e.message)); }
    draw();
  }
  search.addEventListener('input', () => { query = search.value; draw(); });
  ok.addEventListener('click', () => chosen && act('/api/select', { agent, participant: { ...chosen, ...(agent === 'codex' ? { transport } : {}) } }).then(close).catch(() => {}));
  $('modalRoot').replaceChildren(el('div', { class: 'modal', onclick: e => { if (e.target.classList.contains('modal')) close(); } },
    el('div', { class: 'box', role: 'dialog', 'aria-label': `Choose ${NAME[agent]} session` },
      el('div', { class: 'row' }, el('b', { class: `grow ${agent}` }, `${NAME[agent]} session`), el('button', { class: 'ghost', onclick: load }, 'Refresh'), el('button', { class: 'ghost', onclick: close }, '×')),
      search, list, notes,
      el('div', { class: 'row' }, S.selection[agent] ? el('button', { class: 'ghost', onclick: () => act('/api/select', { agent, participant: null }).then(close).catch(() => {}) }, 'Clear') : null,
        el('span', { class: 'grow' }), route, ok))));
  search.focus();
  load();
}

/* ---------- wiring ---------- */
const composer = $('composer');
function autosize() { composer.style.height = 'auto'; composer.style.height = `${Math.min(composer.scrollHeight + 2, 220)}px`; }
composer.value = sessionStorage.getItem('bridgeConsoleDraft') || '';
composer.addEventListener('input', () => { sessionStorage.setItem('bridgeConsoleDraft', composer.value); sessionStorage.removeItem('bridgeConsoleDraftId'); autosize(); renderComposer(); });
// Enter sends, Shift+Enter adds a line. Not while an input method (e.g. Vietnamese Telex) is composing.
composer.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.shiftKey || e.isComposing || e.keyCode === 229) return;
  e.preventDefault();
  send();
});
$('notifyOther').addEventListener('change', renderComposer);
$('sendBtn').addEventListener('click', send);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !viewerClose) $('modalRoot').replaceChildren(); });
function saveAttached() { sessionStorage.setItem('bridgeConsoleFiles', JSON.stringify(attached)); sessionStorage.removeItem('bridgeConsoleDraftId'); }
async function upload(files) {
  for (const file of files) {
    uploading++; renderComposer();
    try {
      const res = await fetch('/api/upload', { method: 'POST', body: file,
        headers: { 'x-console-token': token, 'content-type': 'application/octet-stream', 'x-file-name': encodeURIComponent(file.name || 'pasted.png') } });
      const data = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      if (!attached.some(f => f.id === data.id)) attached.push(data);
      saveAttached();
    } catch (e) { toast(`${file.name}: ${e.message}`); }
    finally { uploading--; renderComposer(); }
  }
}
$('attachBtn').addEventListener('click', () => $('fileInput').click());
$('fileInput').addEventListener('change', e => { upload([...e.target.files]); e.target.value = ''; });
composer.addEventListener('paste', e => { const files = [...(e.clipboardData?.files || [])]; if (files.length) { e.preventDefault(); upload(files); } });
let dragDepth = 0;
document.addEventListener('dragenter', e => { if (e.dataTransfer?.types.includes('Files')) { dragDepth++; document.body.classList.add('dropping'); } });
document.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dropping'); } });
document.addEventListener('dragover', e => { if (e.dataTransfer?.types.includes('Files')) e.preventDefault(); });
document.addEventListener('drop', e => { if (!e.dataTransfer?.files.length) return; e.preventDefault(); dragDepth = 0; document.body.classList.remove('dropping'); upload([...e.dataTransfer.files]); });
// On a phone the sidebar slides in over the page; a tap outside closes it.
$('scrim').addEventListener('click', () => document.body.classList.remove('side-open'));
poll(true);
setInterval(() => { if (!document.hidden) poll(false); }, 1500);
</script>
